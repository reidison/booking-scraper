<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Scraping - Booking Ouro Preto</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #111827;
            margin-bottom: 20px;
            font-size: 28px;
        }
        .info-box {
            max-width: 900px;
            margin: 0 auto 30px auto;
            background-color: #e0f2fe;
            border-left: 5px solid #0284c7;
            padding: 15px 20px;
            border-radius: 4px;
            font-size: 14px;
            color: #0c4a6e;
        }
        .info-box p {
            margin: 5px 0;
        }
        #data-container {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .property-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: box-shadow 0.3s ease;
        }
        .property-card:hover {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        @media (min-width: 640px) {
            .property-card {
                flex-direction: row;
            }
        }
        .property-image-container {
            flex: 0 0 320px;
            background-color: #e5e7eb;
        }
        .property-image {
            width: 100%;
            height: 100%;
            min-height: 220px;
            object-fit: cover;
            display: block;
        }
        .property-content {
            padding: 24px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .property-title {
            font-size: 22px;
            font-weight: 700;
            color: #111827;
            margin: 0 0 8px 0;
        }
        .property-link {
            color: #2563eb;
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 20px;
            display: inline-block;
        }
        .property-link:hover {
            text-decoration: underline;
            color: #1d4ed8;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: auto;
        }
        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }
        th {
            background-color: #f8fafc;
            font-weight: 600;
            color: #475569;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        td {
            font-size: 15px;
            color: #334155;
        }
        .price {
            font-weight: 700;
            color: #059669;
            text-align: right;
        }
        th.price-header {
            text-align: right;
        }
    </style>
</head>
<body>

    <h1>Resultados da Busca - Ouro Preto</h1>
    
    <div class="info-box">
        <p><strong>Configuração:</strong> Check-in: Hoje | Check-out: Amanhã | Ocupação: 2 Adultos, 0 Crianças.</p>
        <p><strong>Dados:</strong> Extraídos em tempo real via agente de navegação do sistema.</p>
    </div>

    <div id="data-container"></div>

    <script src="data.js"></script>
    <script>
        const container = document.getElementById('data-container');
        
        // scrapedData is loaded from data.js
        if (typeof scrapedData !== 'undefined') {
            scrapedData.forEach(property => {
                const card = document.createElement('div');
                card.className = 'property-card';
                
                let roomsRows = '';
                property.room_types.forEach(room => {
                    roomsRows += `
                        <tr>
                            <td>${room.type}</td>
                            <td class="price">${room.price}</td>
                        </tr>
                    `;
                });

                card.innerHTML = `
                    <div class="property-image-container">
                        <img src="${property.main_photo_url}" alt="Foto Principal - ${property.property_name}" class="property-image" onerror="this.src='https://via.placeholder.com/400x300?text=Sem+Imagem';">
                    </div>
                    <div class="property-content">
                        <h2 class="property-title">${property.property_name}</h2>
                        <a href="${property.booking_link}" target="_blank" class="property-link">🔗 Acessar página na Booking.com</a>
                        
                        <table>
                            <thead>
                                <tr>
                                    <th>Tipo/Descrição do Quarto</th>
                                    <th class="price-header">Preço (2 Adultos)</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${roomsRows}
                            </tbody>
                        </table>
                    </div>
                `;
                
                container.appendChild(card);
            });
        } else {
            container.innerHTML = '<p style="text-align:center; padding: 20px;">Nenhum dado encontrado. Por favor, execute o robô de scraping primeiro!</p>';
        }
    </script>
</body>
</html>
