name: Booking Scraper

on:
  schedule:
    # Executa a cada 30 minutos
    - cron: '*/30 * * * *'
  workflow_dispatch: # Permite rodar manualmente a qualquer momento pela aba Actions no GitHub

jobs:
  scrape:
    name: Run Scraper Job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test Connection to Supabase REST API
        run: |
          curl -i -I https://exgcaivlqfivhshfqwbc.supabase.co/rest/v1/ || true
          ping -c 3 exgcaivlqfivhshfqwbc.supabase.co || true

      - name: Debug Fetch and Supabase Connection
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node scratch_debug_fetch.js || true

      - name: Run Scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BOT_API_KEY: ${{ secrets.BOT_API_KEY }}
        run: node --dns-result-order=ipv4first scraper.js --once
